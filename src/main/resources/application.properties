spring.application.name=auth
# NOTA: Cuando se despliega en un Tomcat externo (WAR), este puerto es IGNORADO.
# Tomcat usará su propia configuración (por defecto 8080) definido en server.xml.
server.servlet.context-path=/auth


spring.datasource.url=jdbc:mysql://localhost:3306/carlosch_caja?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Irondesk1530#$@


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.datasource.hikari.max-lifetime=180000


spring.datasource.hikari.idle-timeout=120000


spring.datasource.hikari.validation-timeout=3000


spring.datasource.hikari.connection-test-query=SELECT 1


spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE